project:
  name: dsh-stock-advisor
  timezone: Asia/Shanghai
  currency: CNY

paths:
  data_dir: data
  qlib_provider: qlib_data/akshare_data
  results_dir: results/assistant
  logs_dir: logs

fetch:
  enabled: true
  timeout_seconds: 7200
  retries: 2
  retry_delay_seconds: 3
  max_data_age_days: 5
  # 95% 时 QDII/货币基金的 T+1/T+2 净值发布滞后 + 退市死代码会把覆盖率
  # 长期压在 93.5% 左右，任务空转无法进入发布；死代码已三源逐一确认，
  # 数据实质成功率 97.9%，93% 门槛仍保留约束力。
  min_universe_coverage: 0.93
  # 2026-09-15 整改：**收尾门**，与上面的 min_universe_coverage（放行门）语义不同：
  #   放行门 = 数据够不够发布；收尾门 = 这一天能不能算收尾、轮到下一交易日。
  # 本文件上面的注释已记录过同类事实：QDII/货币基金净值滞后 + 退市死代码把覆盖率
  # 长期压在 ~97.9%，永远到不了 100%。所以收尾门必须留容差——否则 pending == 0
  # 永远不成立，target_date 永不推进、新交易日永远排不上队（2026-09-15 实测卡死约 3 小时）。
  # 代码侧默认 1.0（严格等价 pending == 0），此处显式放宽到 0.975。
  completion_coverage_floor: 0.975
  # 是否允许带 failed 标的收尾（代码侧默认 false）。被豁免的清单会写进
  # job 的 metadata_json，不做无声赦免。当前 failed=6 全部是 NAV 列格式异常的
  # otc_fund（确定性失败），新作业仍会重抓，放行不会丢数据。
  completion_allow_failed: true
  target_lag_trading_days:
    stock: 0
    etf: 1
    otc_fund: 1
  batch_size:
    stock: 100
    etf: 50
    otc_fund: 200
  batch_time_budget_seconds: 600
  # 定向任务（带 symbols 的单股/单 ETF 请求）一次 worker 的总预算。
  # 模型缓存冷启动（provider 重建后的第一笔）需要完整训练一次，可能
  # 超过 10 分钟；全市场波次仍按 batch_time_budget_seconds 分批推进。
  targeted_time_budget_seconds: 3600
  shutdown_grace_seconds: 120
  max_workers: 3
  # 东财日频接口在 3 请求/秒下稳定；此前 1 rps 使全市场刷新下限被限速卡在约 60 标的/分钟。
  requests_per_second: 3.0
  request_timeout_seconds: 20
  # 抓取波次并行通道：股票脚本与基金脚本访问不同数据源，并行不会提高
  # 同一端点的请求速率；etf 与 otc_fund 共用基金通道内部保持串行。
  parallel_asset_fetch: true
  heartbeat_interval_seconds: 5
  worker_stalled_seconds: 60
  backoff_base_seconds: 2
  backoff_max_seconds: 120
  lease_seconds: 1800
  catalog_refresh_hours: 24
  state_db: data/fetch_state.sqlite3
  background_worker_enabled: true

runtime:
  lock_stale_seconds: 21600

# 滚动扫描：全市场抓取进行中按波次增量计算单票技术面得分，维护初选股票池。
# 单票得分只依赖该票自身数据；横截面排名与最终建议仍由覆盖率达标后的完整研究给出。
rolling_scan:
  enabled: true
  state_db: data/rolling_scan.sqlite3
  snapshot_path: results/assistant/rolling_scan.json
  pool_asset_types:
    - stock
    - etf
  pool_size: 30
  # 每类资产各自开池：该类合格样本达到 min_sample 才输出该类的 top-N 名单。
  min_sample: 200
  min_rows: 120
  # 20 日日均成交额（元）流动性门槛，过滤无法交易的边缘标的。
  min_average_amount_20d: 30000000.0
  # 数据截止日距今超过该天数视为过期，自动出池。
  stale_after_days: 15
  max_symbols_per_pass: 800
  score_table_limit: 500

research:
  stock_label_horizon: 20
  stock_topk: 3
  weight_strategy: equal_score
  # 海选原则（有能者居之）：个股目标权重只能由全市场筛选
  # （未指定 symbols 的全量研究）产生的排名给出；定向单票研究
  # 只输出信号与门槛，不产生买入权重。入选者个体 qlib 得分必须为正。
  require_full_universe_for_weights: true
  min_qlib_score_for_weights: 0.0
  # 宁缺毋滥过滤器（2026-09-05 用户规则）：打分后、取 top-k 前剔除
  # ST/*ST/退市整理、上市不满约 60 个交易日（90 日历日）的次新、
  # 20 日均成交额低于 1000 万元的低流动性标的。剔除明细写入 run 的 log_lines。
  pool_exclude_st: true
  min_listing_age_calendar_days: 90
  min_avg_amount_20d: 10000000.0
  # 用户规则（2026-09-06）：不配美股港股等境外敞口。按名称关键词剔除
  # QDII/港股通类 ETF 与基金（标普/纳指/恒生/沪港深/全球/海外等）。
  # 2026-09-07 扩展：源头排除，美港QDII在universe/扫描阶段即不计入统计
  pool_exclude_cross_border: true
  universe_exclude_cross_border: true
  # 2026-09-10 回撤根治（用户确认）：回测与实盘双路径剔除北交所
  # （92/43/83/87/4 开头，±30% 板），降 Top3 集中回撤。打分后、取
  # top-k 前生效；模型信号列表保持完整，剔除明细进 research.log。
  pool_exclude_bj: true
  cross_border_keywords: ["标普","纳斯达克","纳指","道琼斯","美国","美股","美债","美元","恒生","恒指","港股","沪港深","港通","中概","海外","全球","环球","亚太","日经","东京","德国","法国","欧洲","新兴","金砖","REIT","QDII","韩国","中韩","越南","英国"]
  technical_lookback_days: 260
  hypothetical_capital: 100000.0
  # 2026-09-11 整改(P1-4)：回测目标组合口径，使其与实盘的发布对象一致。
  # allocation_slots = 回测复用 portfolio.allocation_budget 时假设的"已分析资产类别数"
  # （实盘为 3：stock/etf/otc_fund）。它决定分配预算 0.2/n，从而决定回测的组合仓位。
  # include_cash = true 时，门槛衡量的是"含现金与仓位约束的目标组合"（= 实际发布对象）；
  # 同时仍会记录满仓口径的 model_quality_backtest，用于模型质量监控，不参与门槛。
  # 两个键都进模型缓存键，改动会触发一次重训。
  backtest_allocation_slots: 3
  backtest_include_cash: true
  # 2026-09-11 整改(P1-5)：重叠 cohort 数（持有期对齐）。
  # 持有期固定取 stock_label_horizon(20)——模型预测的就是未来 20 个交易日的相对
  # 收益，因此回测也必须持有 20 个交易日，否则 20 日 alpha 会被 1 日噪声吃掉，
  # 且 A 股短期反转会让高动量高分股次日系统性回吐。
  # cohorts=5 ⇒ 每 20/5=4 个交易日轮换一个 cohort，任意时点 5 个 cohort 在场，
  # 日换手从约 51% 降到约 1/5。该键进模型缓存键。
  backtest_cohorts: 5
  # 2026-09-11 整改(P0-2)：信号日横截面样本数的绝对下限。低于该值视为"数据不足"
  # （而非模型不合格），提前返回且不写缓存。相对判据（>= 50% 日中位数）已能捕捉
  # 日历末位退化；该绝对值针对全市场 5500+ 只的场景做二次保险。
  # 代码默认（config.DEFAULTS）为 0=关闭，以保测试夹具与 under50 小规模 provider。
  min_signal_scores: 100
  refresh_modes:
    - daily
    - monthly
    - on_demand
  transaction_cost_bps: 10.0
  # on_demand 请求未显式指定 depth 时的缺省深度：quick 只读缓存；
  # standard 刷新指定代码；full 刷新整个代码池（daily/monthly 不受此键影响）。
  default_depth: standard

risk:
  max_single_weight: 0.20
  max_stock_exposure: 0.40
  max_etf_exposure: 0.50
  max_otc_fund_exposure: 0.30
  min_cash_weight: 0.20
  max_daily_turnover: 0.20

gate:
  min_mean_rank_ic: 0.02
  min_rank_ic_ir: 0.10
  min_top_bottom_excess_return: 0.00
  # 回测净值最大回撤上限；仅在指标缺少基准回撤时作为兜底绝对上限。
  max_test_drawdown: 0.25
  # 常规口径：约束"策略回撤超出基准等权回撤"的幅度不超过该容忍度。
  #
  # 决策记录（2026-09-11 整改：禁止再"放宽以放行"）：
  #   2026-09-10 曾把该值由 0.15 放宽到 0.35，理由是"必败空转、让本轮发布"。
  #   实证结论：放宽后**仍然失败**——09-11 实测 |−0.5812| > 0.2116+0.35=0.5616；
  #   且 09-06/07/08 在 scores 正常（4929 个）时同样失败。放宽门槛没有解决问题，
  #   只掩盖了"回测口径与实盘不一致（P1-4）+ 模型拟合不足"这两个真实缺陷。
  #   现恢复 0.15，使生产值与 config.DEFAULTS 重新一致，并由
  #   tests/test_gate_policy.py 断言锁定；后续任何调整必须先改测试与本节记录。
  max_excess_test_drawdown: 0.15
  # 拟合质量门槛：**已回退为关闭**（决策记录 + 自我更正）。
  #
  # 2026-09-11 18:40 初次引入时，我把训练日志 train_l2=0.995423 判读为
  # "模型预测接近常数、什么都没学到"，并据此设了 0.02。当日 19:05 复核证明该判断错误：
  #   · 标签是截面 z-score（方差=1），因此 R² = 1 - train_l2 ≈ IC²。
  #   · 实测 train_l2=0.995423 → 隐含 |ρ| = 0.0677；同期 test mean_rank_ic = 0.0563。
  #     训练集拟合略高于测试 IC，是正常的轻度样本内乐观，完全自洽。
  #   · 理论对照：IC=0.0563 → R²=0.00317 → train_l2 应约 0.9968（实测 0.9954，更优）。
  #   · 5 分组标签均值严格单调（−0.0355/−0.0193/−0.0099/+0.0166/+0.0488）——
  #     破损或常数模型不可能产生等距单调的分组排序。
  # 结论：train_l2≈0.995 是股票截面 alpha 模型的**正常值**（A 股 IC 普遍 0.02~0.09，
  # 对应 R² 仅 0.04%~0.8%）。取 0.02 等于要求 IC ≥ 0.141，A 股不可达，
  # 会让系统永久无法发布。故回退为 0.0（关闭）。
  #
  # 模型质量仍由既有四项门槛负责：min_mean_rank_ic / min_rank_ic_ir /
  # min_top_bottom_excess_return / max_excess_test_drawdown。
  # train_l2 / valid_l2 / implied_ic 作为**诊断量**记录在 model_metadata 中，供人工判读。
  # 该键不进模型缓存键（门槛只影响判定，不动缓存内指标，调整即时重判、不触发重训）。
  min_train_l2_improvement: 0.0

model:
  loss: mse
  seed: 42
  learning_rate: 0.01  # 2026-09-17: 从0.03降至0.01，缓解best_iteration=9早停问题
  num_leaves: 15
  max_depth: 5
  colsample_bytree: 0.8
  subsample: 0.8
  lambda_l1: 0.1
  lambda_l2: 0.1
  # 本机 10 核 16 线程；线程数只影响训练速度，但属于模型缓存键，
  # 调整会触发一次重新训练（预热由下一次 provider 重建后的首个任务完成）。
  num_threads: 8
  # 158 列大数据集下列式优先，跳过 LightGBM 每次训练前的方向探测。
  force_col_wise: true
  num_boost_round: 300
  early_stopping_rounds: 30

dataset:
  # 2026-09 前滚：原窗口 2020→2022 训练数据陈旧三年半，且全宇宙 Alpha158
  # 特征矩阵 7.8M 行（4.59 GiB）超出 16GB 内存（MemoryError 实证）。
  # 前滚到 2023→2026 后约 4.1M 行（~2.4 GiB），内存可容纳且数据新鲜。
  start_time: "2023-01-03"
  fit_start_time: "2023-04-01"
  fit_end_time: "2025-09-30"
  segments:
    train:
      - "2023-04-01"
      - "2025-09-30"
    valid:
      - "2025-10-09"
      - "2026-03-31"
    test:
      - "2026-04-01"
      - "2099-12-31"

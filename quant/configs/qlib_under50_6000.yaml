qlib_init:
  provider_uri: qlib_data/akshare_data
  region: cn

dataset:
  instruments: [SZ000651, SH600887, SH600900, SH600886, SH600919, SH600938, SZ002142, SZ300628, SZ000895, SZ002078, SZ002352, SH601225, SH601919, SH600690, SH600066, SH601598]
  start_time: "2020-04-01"
  end_time: "2026-08-24"
  fit_start_time: "2020-04-01"
  fit_end_time: "2022-11-30"
  segments:
    train: ["2020-04-01", "2022-11-30"]
    valid: ["2023-01-03", "2024-05-24"]
    test: ["2024-07-01", "2026-08-24"]
  label_horizon: 20

model:
  loss: mse
  seed: 42
  learning_rate: 0.03
  num_leaves: 15
  max_depth: 5
  colsample_bytree: 0.8
  subsample: 0.8
  lambda_l1: 0.1
  lambda_l2: 0.1
  num_threads: 2
  num_boost_round: 300
  early_stopping_rounds: 30

simulation:
  initial_cash: 6000
  lot_size: 100
  max_positions: 2
  max_position_weight: 0.55
  reserve_cash_ratio: 0.15
  candidate_depth: 8
  open_cost: 0.0003
  close_cost: 0.0013
  min_cost: 5
  rebalance: month_end_signal_next_open
  benchmark: SH510300

gate:
  min_test_rank_ic: 0.02
  min_rank_ic_ir: 0.15
  min_net_annualized_return: 0.0
  max_drawdown_floor: -0.35

results:
  output_dir: results/qlib_under50_6000
  report_path: docs/research/2026-08-24-qlib-under50-6000-plan.md

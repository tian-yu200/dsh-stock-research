# 提交前聚焦测试门禁（T6，2026-10-10）：自动执行不变量 §8 的聚焦测试集。
# 安装（仅需一次）：pip install pre-commit && pre-commit install —— 详见 README「测试」一节。
# hook 用相对路径调用 quant/.venv/Scripts/python.exe：需在主检出（含 quant/.venv 与
# quant/data）中执行；缺少这两者的 worktree 会失败，属预期（不放宽、不跳过）。
repos:
  - repo: local
    hooks:
      - id: quant-focused-tests
        name: quant focused tests (invariants section 8)
        entry: quant/.venv/Scripts/python.exe -m pytest quant/tests/test_market_data.py quant/tests/test_data_source_breaker.py quant/tests/test_data_source_ths.py quant/tests/test_fetch_stock_worker.py quant/tests/test_unit_guard.py quant/tests/test_assistant.py quant/tests/test_research_snapshot.py quant/tests/test_gate_policy.py quant/tests/test_backtest_tradability.py -q -p no:warnings
        language: system
        pass_filenames: false
        always_run: true

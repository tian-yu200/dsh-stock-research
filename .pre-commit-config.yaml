# 提交前聚焦测试门禁（T6，2026-10-10；T17 worktree 友好，2026-10-12）：自动执行不变量 §8 的聚焦测试集。
# 安装（仅需一次）：pre-commit 装在独立工具环境（切勿装进 quant/.venv），
#   py -m pip install --user pre-commit   （或专用 venv）；再执行 pre-commit install —— 详见 README「测试」一节。
# hook 经 tasks/precommit-focused-tests.ps1 解释器：用
#   git rev-parse --path-format=absolute --git-common-dir 的父目录定位主检出的
#   quant/.venv/Scripts/python.exe，在**当前检出**根目录运行同一组测试、同一严格度
#   （不放宽、不跳过）。当前检出缺 quant/data/benchmarks/trade_calendar.csv 时立即
#   失败并提示临时拷入（不自动拷贝）。.git/hooks 为所有 worktree 共享，因此主检出
#   与 linked worktree 行为一致。
repos:
  - repo: local
    hooks:
      - id: quant-focused-tests
        name: quant focused tests (invariants section 8)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File tasks/precommit-focused-tests.ps1
        language: system
        pass_filenames: false
        always_run: true
